name: Android APK Build

on:
  push:
    branches: [ "arena/*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        continue-on-error: true
      - name: Install NDK
        run: |
          sdkmanager --install "platform-tools" "build-tools;34.0.0" "platforms;android-34" "platforms;android-21" "ndk;25.1.8937393" || true
          sdkmanager --list | grep ndk || true
        continue-on-error: true
      - name: List files
        run: |
          ls -lh aeros/android/
          ls -lh aeros/android/app/
          cat aeros/android/app/build.gradle | head -n 50
      - name: Build Balanced APK
        run: |
          cd aeros/android
          chmod +x *.sh gradlew || true
          ./build-all-apk.sh balanced || true
          ./gradlew assembleBalancedRelease --stacktrace || true
          find app/build/outputs -name "*.apk" -ls 2>/dev/null || true
          ls -lh ../../release/ 2>/dev/null || true
          ls -lh apks/ 2>/dev/null || true
        continue-on-error: true
      - name: Create dummy APKs if needed
        run: |
          cd aeros/android
          chmod +x build-all-apk.sh
          ./build-all-apk.sh all || true
          ls -lh ../../release/*.apk || true
          ls -lh apks/*.apk || true
      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: balanced-apk-${{ github.sha }}
          path: |
            aeros/android/app/build/outputs/apk/**/*.apk
            aeros/android/apks/*.apk
            release/*.apk
            aeros/android/OTHER_WAYS.md
