name: Android APK Build

on:
  push:
    branches: [ "arena/*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install NDK
        run: sdkmanager --install "platform-tools" "build-tools;34.0.0" "platforms;android-34" "platforms;android-21" "ndk;25.1.8937393"
      - name: Build Balanced APK
        run: |
          cd aeros/android
          chmod +x *.sh gradlew
          ./gradlew assembleBalancedRelease --stacktrace || true
          find app/build/outputs -name "*.apk" -ls || true
          ls -lh ../../release/ || true
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: balanced-apk
          path: |
            aeros/android/app/build/outputs/apk/**/*.apk
            release/*.apk
