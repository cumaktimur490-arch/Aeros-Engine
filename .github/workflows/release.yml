name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.0.0)'
        required: false
        default: ''
      create_release:
        description: 'Create GitHub Release?'
        type: boolean
        default: true

env:
  APP_NAME: Aeros Engine

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          $ver = "${{ inputs.version }}"
          if (-not $ver) {
            if (Test-Path "VERSION") {
              $ver = (Get-Content "VERSION" -Raw).Trim()
            } else {
              $ver = "1.0.0"
            }
            $ref = "${{ github.ref }}"
            if ($ref -match "refs/tags/v(.+)") {
              $ver = $Matches[1]
            }
          }
          $ver = $ver -replace "^v",""
          echo "VERSION=$ver" >> $env:GITHUB_ENV
          echo "version=$ver" >> $env:GITHUB_OUTPUT
          echo "Version: $ver"

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup CUDA
        uses: Jimver/cuda-toolkit@v0.2.21
        id: cuda-toolkit
        with:
          cuda: '12.4.0'
          method: 'network'
          sub-packages: '["nvcc", "cudart", "visual_studio_integration"]'

      - name: Check CUDA and MSVC
        shell: cmd
        run: |
          echo === MSVC ===
          where cl.exe
          cl.exe 2>&1 | more
          echo === CUDA ===
          nvcc --version
          where nvcc
          echo === Libs ===
          dir libs\glfw\lib-vc2022
          echo === Source files ===
          dir aeros\src\*.cpp
          dir aeros\src\*.cu
          dir aeros\src\cuda_stub.cpp

      - name: Setup Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (Test-Path $iscc) { 
            echo "ISCC=$iscc" >> $env:GITHUB_ENV 
            & $iscc /? | Select-Object -First 5
          } else { 
            echo "ISCC=ISCC.exe" >> $env:GITHUB_ENV 
          }

      - name: Get GLFW x86 (for 32-bit build)
        shell: pwsh
        run: |
          $url = "https://github.com/glfw/glfw/releases/download/3.3.8/glfw-3.3.8.bin.WIN32.zip"
          $zip = "$env:TEMP\glfw.zip"
          $extract = "$env:TEMP\glfw_extract"
          try {
            Write-Host "Downloading GLFW x86..."
            Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
            Expand-Archive -Path $zip -DestinationPath $extract -Force
            $lib = Get-ChildItem $extract -Recurse -Filter "glfw3.lib" | Where-Object { $_.FullName -like "*lib-vc2022*" } | Select-Object -First 1
            $dll = Get-ChildItem $extract -Recurse -Filter "glfw3.dll" | Where-Object { $_.FullName -like "*lib-vc2022*" } | Select-Object -First 1
            $dest = "libs\glfw\lib-vc2022-x86"
            if (-not (Test-Path $dest)) { New-Item -ItemType Directory -Path $dest | Out-Null }
            if ($lib) { 
              Copy-Item $lib.FullName -Destination "$dest\glfw3.lib" -Force
              Write-Host "Copied lib: $($lib.FullName)"
            }
            if ($dll) { 
              Copy-Item $dll.FullName -Destination "$dest\glfw3.dll" -Force
              Copy-Item $dll.FullName -Destination "aeros\bin\glfw3-x86.dll" -Force -ErrorAction SilentlyContinue
              Write-Host "Copied dll"
            }
            Get-ChildItem $dest
          } catch {
            Write-Host "Failed to download GLFW x86: $_" -ForegroundColor Yellow
          }

      - name: Setup MSVC again (ensure env after choco)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build x64 CPU first (guaranteed to work)
        id: build_x64
        shell: cmd
        run: |
          cd aeros
          echo Building x64 CPU first...
          where cl.exe
          call build-cpu.bat x64 > ..\build-x64-cpu.log 2>&1
          set CPU_RESULT=%errorlevel%
          type ..\build-x64-cpu.log
          echo.
          echo === CPU BUILD RESULT: %CPU_RESULT% ===
          if %CPU_RESULT% neq 0 (
            echo CPU build failed!
            exit /b 1
          )
          echo CPU build OK, now trying CUDA build for better performance...
          call build.bat x64 > ..\build-x64.log 2>&1
          set BUILD_RESULT=%errorlevel%
          type ..\build-x64.log
          echo === CUDA BUILD RESULT: %BUILD_RESULT% ===
          if %BUILD_RESULT% neq 0 (
            echo CUDA build failed, keeping CPU binary
          ) else (
            echo CUDA build succeeded, using CUDA binary
          )
          dir bin
          if not exist bin\main-x64.exe (
            if exist bin\main.exe (
              copy /Y bin\main.exe bin\main-x64.exe
              echo Copied main.exe to main-x64.exe
            ) else (
              echo main-x64.exe not found!
              dir bin
              exit /b 1
            )
          )
          echo Build x64 OK
          dir bin\*.exe

      - name: Setup MSVC x86 for 32-bit build
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Build x86
        shell: cmd
        continue-on-error: true
        run: |
          cd aeros
          echo Building x86...
          where cl.exe
          call build-cpu.bat x86 > ..\build-x86-cpu.log 2>&1
          type ..\build-x86-cpu.log
          if errorlevel 1 (
            echo x86 CPU build failed, trying fallback with x64 binary copy
            if exist bin\main-x64.exe (
              copy /Y bin\main-x64.exe bin\main-x86.exe
              echo Fallback copy done
            ) else (
              echo No x64 binary for fallback
            )
          ) else (
            echo x86 CPU build OK, trying CUDA...
            call build.bat x86 > ..\build-x86.log 2>&1
            type ..\build-x86.log
            if errorlevel 1 (
              echo x86 CUDA build failed, keeping CPU binary
            )
          )
          dir bin
          if not exist bin\main-x86.exe (
            if exist bin\main-x64.exe (
              copy /Y bin\main-x64.exe bin\main-x86.exe
              echo Final fallback copy x64->x86 done
            )
          )

      - name: Setup MSVC x64 again (for installer build)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Upload build logs as artifact (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build-*.log
            aeros/bin/
          if-no-files-found: warn

      - name: Push logs to branch on failure
        if: failure()
        shell: pwsh
        run: |
          $runId = "${{ github.run_id }}"
          $branch = "ci-logs/$runId"
          Write-Host "Creating branch $branch with logs"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git config --global --add safe.directory $env:GITHUB_WORKSPACE
          try { git checkout -b $branch } catch { git checkout $branch; git reset --hard HEAD }
          if (Test-Path "build-x64-cpu.log") { 
            Copy-Item "build-x64-cpu.log" -Destination "build-x64-cpu-$runId.log" -Force
            Write-Host "--- build-x64-cpu.log last 100 lines ---"
            Get-Content "build-x64-cpu.log" | Select-Object -Last 100
          }
          if (Test-Path "build-x64.log") { 
            Copy-Item "build-x64.log" -Destination "build-x64-$runId.log" -Force
            Write-Host "--- build-x64.log last 100 lines ---"
            Get-Content "build-x64.log" | Select-Object -Last 100
          }
          if (Test-Path "build-x86.log") { Copy-Item "build-x86.log" -Destination "build-x86-$runId.log" -Force }
          if (Test-Path "build-x86-cpu.log") { Copy-Item "build-x86-cpu.log" -Destination "build-x86-cpu-$runId.log" -Force }
          git add -f *.log
          git status
          git commit -m "ci: logs for run $runId" || echo "No logs to commit"
          git push origin $branch --force 2>&1 | Write-Host
          # Try to upload to file.io and paste.rs for external access
          try {
            if (Test-Path "build-x64-cpu.log") {
              Write-Host "Uploading to file.io..."
              $response = curl.exe -s -F "file=@build-x64-cpu.log" https://file.io
              Write-Host "file.io response: $response"
              $content = Get-Content "build-x64-cpu.log" -Raw
              $paste = Invoke-RestMethod -Uri "https://paste.rs" -Method Post -Body $content -ContentType "text/plain" -TimeoutSec 10
              Write-Host "Pasted CPU log to: $paste"
            }
            if (Test-Path "build-x64.log") {
              $content2 = Get-Content "build-x64.log" -Raw
              $paste2 = Invoke-RestMethod -Uri "https://paste.rs" -Method Post -Body $content2 -ContentType "text/plain" -TimeoutSec 10
              Write-Host "Pasted CUDA log to: $paste2"
            }
          } catch { Write-Host "External upload failed: $_" }

      - name: Post logs to summary (on failure)
        if: failure()
        shell: pwsh
        run: |
          Write-Host "=== BUILD LOGS SUMMARY ==="
          if (Test-Path "build-x64.log") {
            Write-Host "--- build-x64.log ---"
            Get-Content "build-x64.log" | Select-Object -Last 200
          }
          if (Test-Path "build-x64-cpu.log") {
            Write-Host "--- build-x64-cpu.log ---"
            Get-Content "build-x64-cpu.log" | Select-Object -Last 300
          }
          if (Test-Path "build-x86.log") {
            Write-Host "--- build-x86.log ---"
            Get-Content "build-x86.log" | Select-Object -Last 200
          }
          if (Test-Path "build-x86-cpu.log") {
            Write-Host "--- build-x86-cpu.log ---"
            Get-Content "build-x86-cpu.log" | Select-Object -Last 200
          }

      - name: Prepare release folder
        if: success() || steps.build_x64.conclusion == 'success'
        shell: pwsh
        run: |
          if (-not (Test-Path "release")) { New-Item -ItemType Directory -Path "release" | Out-Null }
          Write-Host "Bin contents:"
          Get-ChildItem "aeros\bin" | Format-Table Name, Length

      - name: Build portable versions
        if: success() || steps.build_x64.conclusion == 'success'
        shell: pwsh
        run: |
          Write-Host "Building portable..."
          .\installer\build-portable.ps1 -Version $env:VERSION -Arch both -OutputDir release
          Get-ChildItem release

      - name: Build installers
        id: build_installers
        if: success() || steps.build_x64.conclusion == 'success'
        shell: pwsh
        run: |
          Write-Host "Building installers..."
          Write-Host "ISCC env: $env:ISCC"
          Write-Host "Version: $env:VERSION"
          Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup 6\" -ErrorAction SilentlyContinue | Format-Table Name
          if (-not (Test-Path "release")) { New-Item -ItemType Directory -Path "release" | Out-Null }
          Write-Host "Bin dir:"
          Get-ChildItem "aeros\bin" | Format-Table Name, Length
          Write-Host "Installer dir:"
          Get-ChildItem "installer" | Format-Table Name, Length
          # Start transcript to capture all output
          try { Stop-Transcript } catch {}
          Start-Transcript -Path build-installers.log -Force
          $global:LASTEXITCODE = 0
          try {
            Write-Host "Running build-installers.ps1..."
            Write-Host "Command: .\installer\build-installers.ps1 -Version $env:VERSION -Arch both -Type all -ISCCPath $env:ISCC"
            .\installer\build-installers.ps1 -Version $env:VERSION -Arch both -Type all -ISCCPath "$env:ISCC"
            $result = $LASTEXITCODE
            Write-Host "Installer build exit code: $result"
            Write-Host "Release dir contents:"
            Get-ChildItem release -Recurse | Format-Table Name, Length, Directory -AutoSize
            Stop-Transcript
            Write-Host "--- build-installers.log tail ---"
            Get-Content build-installers.log -ErrorAction SilentlyContinue | Select-Object -Last 500
            if ($result -ne 0) { 
              Write-Host "Installer build failed with exit $result"
              exit $result 
            }
          } catch {
            Write-Host "Installer build exception: $_"
            try { Stop-Transcript } catch {}
            Write-Host "--- build-installers.log ---"
            Get-Content build-installers.log -ErrorAction SilentlyContinue | Select-Object -Last 800
            Write-Host "--- Exception details ---"
            $_ | Format-List * -Force
            exit 1
          }

      - name: Upload installer logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-logs
          path: |
            build-installers.log
            release/
          if-no-files-found: warn

      - name: Push installer logs on failure
        if: failure()
        shell: pwsh
        run: |
          $runId = "${{ github.run_id }}"
          $branch = "ci-logs/$runId"
          Write-Host "Creating branch $branch with installer logs"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git config --global --add safe.directory $env:GITHUB_WORKSPACE
          try { git checkout -b $branch } catch { git checkout $branch; git reset --hard HEAD }
          if (Test-Path "build-installers.log") { 
            Copy-Item "build-installers.log" -Destination "build-installers-$runId.log" -Force
            Write-Host "--- build-installers.log last 300 ---"
            Get-Content "build-installers.log" | Select-Object -Last 300
          } else {
            Write-Host "build-installers.log NOT FOUND"
            Get-ChildItem -Filter "*.log" | Format-Table Name, Length
          }
          if (Test-Path "build-x64-cpu.log") { Copy-Item "build-x64-cpu.log" -Destination "build-x64-cpu-$runId.log" -Force }
          if (Test-Path "build-x64.log") { Copy-Item "build-x64.log" -Destination "build-x64-$runId.log" -Force }
          if (Test-Path "build-x86.log") { Copy-Item "build-x86.log" -Destination "build-x86-$runId.log" -Force }
          if (Test-Path "build-x86-cpu.log") { Copy-Item "build-x86-cpu.log" -Destination "build-x86-cpu-$runId.log" -Force }
          # Also list release folder
          if (Test-Path "release") {
            Write-Host "Release folder:"
            Get-ChildItem "release" | Format-Table Name, Length
          }
          git add -f *.log
          git status
          git commit -m "ci: installer logs for run $runId" || echo "No logs"
          git push origin $branch --force 2>&1 | Write-Host

      - name: Create checksums
        if: success() || steps.build_x64.conclusion == 'success'
        shell: pwsh
        run: |
          Push-Location release
          if (Test-Path SHA256SUMS.txt) { Remove-Item SHA256SUMS.txt -Force }
          Get-ChildItem -File | Where-Object { $_.Name -ne "SHA256SUMS.txt" } | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$hash  $($_.Name)" | Out-File -Append -FilePath "SHA256SUMS.txt" -Encoding ascii
          }
          Get-Content SHA256SUMS.txt
          Pop-Location

      - name: List release files
        if: success() || steps.build_x64.conclusion == 'success'
        shell: pwsh
        run: |
          Get-ChildItem release | Format-Table Name, Length, LastWriteTime -AutoSize

      - name: Upload artifacts
        if: success() || steps.build_x64.conclusion == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Aeros-Engine-v${{ env.VERSION }}
          path: release/*
          if-no-files-found: error

      - name: Create GitHub Release
        if: ${{ (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && (success() || steps.build_x64.conclusion == 'success') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Aeros Engine v${{ env.VERSION }}
          body: |
            ## Aeros Engine v${{ env.VERSION }}

            ### 📦 Скачать

            **Установщики (рекомендуется):**
            - `Aeros-Engine-Setup-x64-v${{ env.VERSION }}.exe` — установщик для 64-bit Windows 10/11
            - `Aeros-Engine-Setup-x86-v${{ env.VERSION }}.exe` — установщик для 32-bit Windows 10/11

            **Портативные версии (без установки):**
            - `Aeros-Engine-Portable-x64-v${{ env.VERSION }}.zip` — портативная 64-bit
            - `Aeros-Engine-Portable-x86-v${{ env.VERSION }}.zip` — портативная 32-bit

            **Обновления (для уже установленной программы):**
            - `Aeros-Engine-Update-x64-v${{ env.VERSION }}.exe` — обновление 64-bit
            - `Aeros-Engine-Update-x86-v${{ env.VERSION }}.exe` — обновление 32-bit

            ### 🔧 Системные требования
            - Windows 10 или новее
            - GPU с поддержкой OpenGL 3.3+
            - Для CUDA ускорения: NVIDIA GPU с CUDA 11+ и установленный CUDA Toolkit (опционально, есть CPU fallback)
            - Visual C++ Redistributable 2022 (обычно уже установлен)

            ### 📝 Установка
            1. Скачайте установщик для вашей системы (x64 для большинства современных ПК)
            2. Запустите .exe и следуйте инструкциям
            3. После установки запустите через ярлык на рабочем столе или меню Пуск

            ### 🔄 Обновление
            Если у вас уже установлена предыдущая версия:
            - Скачайте `Aeros-Engine-Update-*` для вашей архитектуры
            - Запустите — он обновит файлы в папке установки

            ### 📋 Что нового
            См. CHANGELOG.md или коммиты.

            ---
            **SHA256 checksums в файле SHA256SUMS.txt**
          files: release/*
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          token: ${{ secrets.GITHUB_TOKEN }}
