# PC-релиз AeroS Engine: как в прежних PC-версиях — установщики, апдейтеры
# и портативные zip для x64 / x86 / arm64 + SHA256SUMS.
# x64 собирается с CUDA (fallback — CPU), x86 и arm64 — CPU-сборки.
# Версия читается из aeros/src/version.h и сверяется с тегом vX.Y.Z.
name: PC Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

# Два параллельных прогона одного тега удаляли и пересоздавали бы один и тот же
# релиз одновременно (гонка при загрузке ассетов). Прогон для тега — по одному.
concurrency:
  group: pc-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pc-release:
    name: Windows x64/x86/arm64 (MSVC + CUDA + Inno)
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint PowerShell (все .ps1 и все inline-блоки этого воркфлоу)
        shell: pwsh
        run: |
          # Ошибка разбора PowerShell ломает шаг молча и лишь в самом конце долгой сборки,
          # а логи шагов наружу не отдаются. Поэтому синтаксис проверяем сразу: Parser
          # возвращает ошибки с номерами строк, мы дублируем их в аннотации ::error::.
          $bad = 0
          $files = @(Get-ChildItem -Path installer, tools -Filter *.ps1 -File -Recurse)
          foreach ($file in $files) {
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$null, [ref]$errors)
            if ($errors -and $errors.Count -gt 0) {
              $bad++
              foreach ($e in $errors) {
                Write-Host "::error::$($file.Name):$($e.Extent.StartLineNumber): $($e.Message)"
              }
            } else {
              Write-Host "[lint] OK $($file.Name)"
            }
          }

          # Inline-блоки run: | из этого же файла: вырезаем по отступу, заменяем
          # выражения GitHub (dollar + двойная фигурная скобка) на плейсхолдер CIEXPR.
          # Иначе парсер PowerShell увидит их как имя переменной в фигурных скобках.
          # ВАЖНО: literal-последовательность выражения GitHub нельзя писать даже в
          # комментарии - движок Actions подставляет её при чтении файла и прогон
          # падает ещё до создания job'ов.
          $wf = ".github/workflows/pc-release.yml"
          $lines = @(Get-Content $wf)
          $i = 0
          $blocks = 0
          while ($i -lt $lines.Count) {
            if ($lines[$i] -match '^(\s+)run:\s*\|\s*$') {
              $indent = $Matches[1].Length
              # bash/cmd-блоки парсером PowerShell проверять нельзя - смотрим shell: шага
              $shell = "pwsh"
              for ($k = $i - 1; $k -ge 0 -and $k -ge $i - 4; $k--) {
                if ($lines[$k] -match '^\s*shell:\s*(\S+)') { $shell = $Matches[1]; break }
              }
              if ($shell -ne "pwsh" -and $shell -ne "powershell") { $i++; continue }
              $from = $i + 1
              $block = @()
              $j = $from
              while ($j -lt $lines.Count) {
                if ($lines[$j].Trim() -eq "") { $block += ""; $j++; continue }
                if ($lines[$j].Length -le $indent) { break }
                if ($lines[$j].Substring(0, $indent).Trim() -ne "") { break }
                $block += $lines[$j].Substring($indent)
                $j++
              }
              $blocks++
              $text = [regex]::Replace(($block -join "`n"), '\$\{\{[^}]*\}\}', 'CIEXPR')
              $errors = $null
              $null = [System.Management.Automation.Language.Parser]::ParseInput($text, [ref]$null, [ref]$errors)
              if ($errors -and $errors.Count -gt 0) {
                $bad++
                foreach ($e in $errors) {
                  $ln = $from + $e.Extent.StartLineNumber
                  Write-Host "::error::pc-release.yml:$ln : inline pwsh: $($e.Message)"
                }
              }
              $i = $j
            } else { $i++ }
          }
          Write-Host "[lint] inline-блоков проверено: $blocks"
          if ($bad -gt 0) { throw "PowerShell syntax errors in $bad source(s)" }
          Write-Host "::notice::ps-lint: синтаксис $($files.Count) скриптов и $blocks inline-блоков в порядке"

      - name: Read version from aeros/src/version.h
        id: ver
        shell: pwsh
        run: |
          $h = Get-Content aeros/src/version.h -Raw
          if ($h -notmatch '#define AEROS_VERSION_STRING "([^"]+)"') { throw "AEROS_VERSION_STRING not found in aeros/src/version.h" }
          $v = $Matches[1]
          Write-Host "AEROS_VERSION = $v"
          "version=$v" | Out-File -Append $env:GITHUB_OUTPUT

      - name: Tag must match AEROS_VERSION
        shell: pwsh
        run: |
          $ref = "$env:GITHUB_REF"
          if ($ref -like 'refs/tags/*') {
            $tag = $ref -replace '^refs/tags/',''
            $want = "v${{ steps.ver.outputs.version }}"
            if ($tag -ne $want) { throw "Tag '$tag' does not match AEROS_VERSION (expected '$want')" }
            Write-Host "Tag OK: $tag"
          }

      - name: Setup MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '13.2.0'

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "choco install innosetup failed" }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found" }
          "ISCC=$iscc" | Out-File -Append $env:GITHUB_ENV
          Write-Host "ISCC: $iscc"

      - name: Clean stale binaries (никаких прошлых exe в bin)
        shell: pwsh
        run: |
          # Если в bin останется exe прошлой/чужой сборки, упаковка может положить его в релиз.
          Get-ChildItem aeros\bin -Filter "main*.exe" -ErrorAction SilentlyContinue | Remove-Item -Force -Verbose
          Get-ChildItem aeros\bin -Filter "aeros-engine*.exe" -ErrorAction SilentlyContinue | Remove-Item -Force -Verbose
          Get-ChildItem aeros\bin -Filter "cudart*.dll" -ErrorAction SilentlyContinue | Remove-Item -Force -Verbose
          Get-ChildItem aeros\bin | Format-Table Name, Length

      - name: GLFW for x86 (prebuilt)
        shell: pwsh
        run: .\tools\get-glfw-x86.ps1

      - name: GLFW for arm64 (from source)
        shell: pwsh
        run: .\tools\build-glfw-arm64.ps1 -Arch arm64

      - name: Build x64 (CUDA, fallback CPU)
        shell: pwsh
        run: |
          $out = cmd /c "cd aeros && call build.bat x64" 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path aeros\bin\main-x64.exe)) {
            Write-Host "[ci] CUDA build failed or no exe - CPU fallback"
            $out2 = cmd /c "cd aeros && call build-cpu.bat x64" 2>&1 | Out-String
            Write-Host $out2
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path aeros\bin\main-x64.exe)) {
              $tail = (($out + $out2) -split "`r?`n") | Select-Object -Last 30
              Write-Host ("::error::tail x64 build%0A" + ($tail -join "%0A"))
              throw "x64 build failed"
            }
          }
          function PE-Machine($path) {
            $b = [System.IO.File]::ReadAllBytes($path)
            $pe = [BitConverter]::ToInt32($b, 60)
            return [BitConverter]::ToUInt16($b, $pe + 4).ToString('X4')
          }
          $cudart = Get-ChildItem "$env:CUDA_PATH\bin\cudart64*.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($cudart) { Copy-Item $cudart.FullName aeros\bin\ -Force; Write-Host "[ci] bundled $($cudart.Name)" }
          Get-ChildItem aeros\bin\main*.exe | Format-Table Name, Length
          $mach = PE-Machine "aeros\bin\main-x64.exe"
          Write-Host "[ci] PE machine main-x64.exe = $mach (8664 = x64)"
          if ($mach -ne "8664") { throw "main-x64.exe has wrong PE machine $mach (expected 8664)" }

      - name: Setup MSVC x86
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Build x86 (CPU)
        shell: pwsh
        run: |
          cl 2>&1 | Select-Object -First 2 | ForEach-Object { Write-Host "CLBANNER: $_" }
          function PE-Machine($path) {
            $b = [System.IO.File]::ReadAllBytes($path)
            $pe = [BitConverter]::ToInt32($b, 60)
            return [BitConverter]::ToUInt16($b, $pe + 4).ToString('X4')
          }
          $out = cmd /c "cd aeros && call build-cpu.bat x86" 2>&1 | Out-String
          Write-Host $out
          $mach = PE-Machine "aeros\bin\main-x86.exe"
          Write-Host "[ci] PE machine main-x86.exe = $mach (014C = x86)"
          if ($mach -ne "014C") { throw "main-x86.exe has wrong PE machine $mach (expected 014C)" }
          if ($LASTEXITCODE -ne 0) {
            $tail = ($out -split "`r?`n") | Select-Object -Last 40
            Write-Host ("::error::tail of build-cpu.bat x86%0A" + ($tail -join "%0A"))
            throw "build-cpu.bat x86 failed"
          }

      - name: Setup MSVC arm64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64

      - name: Build arm64 (CPU)
        shell: pwsh
        run: |
          cl 2>&1 | Select-Object -First 2 | ForEach-Object { Write-Host "CLBANNER: $_" }
          $out = cmd /c "cd aeros && call build-cpu.bat arm64" 2>&1 | Out-String
          Write-Host $out
          function PE-Machine($path) {
            $b = [System.IO.File]::ReadAllBytes($path)
            $pe = [BitConverter]::ToInt32($b, 60)
            return [BitConverter]::ToUInt16($b, $pe + 4).ToString('X4')
          }
          $mach = PE-Machine "aeros\bin\main-arm64.exe"
          Write-Host "[ci] PE machine main-arm64.exe = $mach (AA64 = arm64)"
          if ($mach -ne "AA64") { throw "main-arm64.exe has wrong PE machine $mach (expected AA64)" }
          if ($LASTEXITCODE -ne 0) {
            $tail = ($out -split "`r?`n") | Select-Object -Last 40
            Write-Host ("::error::tail of build-cpu.bat arm64%0A" + ($tail -join "%0A"))
            throw "build-cpu.bat arm64 failed"
          }

      - name: Build portable zips
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          # Логи шагов наружу не отдаются, поэтому всё важное дублируем в аннотации.
          # Сначала — снимок aeros\bin: какие бинари/DLL реально лежат на диске
          # и какой у них PE machine. Это единственный способ понять, чем именно
          # недоволен упаковщик, без скачивания логов.
          function PE-Machine($path) {
            $b = [System.IO.File]::ReadAllBytes($path)
            if ($b.Length -lt 64 -or $b[0] -ne 0x4D -or $b[1] -ne 0x5A) { return "????" }
            $pe = [BitConverter]::ToInt32($b, 60)
            return [BitConverter]::ToUInt16($b, $pe + 4).ToString('X4')
          }
          $pre = @()
          foreach ($n in @("main.exe","main-x64.exe","main-x86.exe","main-arm64.exe","glfw3.dll","glfw3-x86.dll","glfw3-arm64.dll")) {
            $p = "aeros\bin\$n"
            if (Test-Path $p) { $pre += "$n=$(PE-Machine $p)/$((Get-Item $p).Length)" } else { $pre += "$n=ABSENT" }
          }
          $pre += "stl=$(@(Get-ChildItem aeros\bin -Filter *.stl -File).Count)"
          Write-Host "::notice::preflight-bin: $($pre -join ' ')"
          $out = ""
          $failed = $false
          try {
            $out = & .\installer\build-portable.ps1 -Version $v -Arch all -OutputDir release 2>&1 | Out-String
          } catch {
            $failed = $true
            $out += "`nEXCEPTION: " + $_.Exception.Message + "`n" + $_.ScriptStackTrace
          }
          Write-Host $out
          Get-ChildItem release -ErrorAction SilentlyContinue | Format-Table Name, Length
          $missing = @(@("x64","x86","arm64") | Where-Object { -not (Test-Path "release\Aeros-Engine-Portable-$_-v$v.zip") })
          if ($failed -or $missing.Count -gt 0) {
            $lines = ($out -split "`r?`n") | Where-Object { $_.Trim() } | Select-Object -Last 25
            foreach ($l in $lines) { Write-Host "::error::portable: $l" }
            throw "build-portable.ps1 failed (missing: $($missing -join ', '))"
          }
          Write-Host "::notice::portable: все 3 zip созданы (x64/x86/arm64), PE-контроль бинарей пройден"
          Write-Host "[ci] all 3 portable zips present"

      - name: Verify portable zips (PE machine внутри архива)
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          function PE-Machine($path) {
            $b = [System.IO.File]::ReadAllBytes($path)
            if ($b.Length -lt 64 -or $b[0] -ne 0x4D -or $b[1] -ne 0x5A) { return "????" }
            $pe = [BitConverter]::ToInt32($b, 60)
            return [BitConverter]::ToUInt16($b, $pe + 4).ToString('X4')
          }
          $expect = @{ "x64" = "8664"; "x86" = "014C"; "arm64" = "AA64" }
          $facts = @()
          try {
            foreach ($a in @("x64","x86","arm64")) {
              $zip = "release\Aeros-Engine-Portable-$a-v$v.zip"
              if (-not (Test-Path $zip)) { throw "нет $zip" }
              $tmp = Join-Path $env:RUNNER_TEMP "zipcheck-$a"
              if (Test-Path $tmp) { Remove-Item -Recurse -Force $tmp }
              Expand-Archive -Path $zip -DestinationPath $tmp -Force
              $one = "$a"
              foreach ($n in @("AerosEngine.exe","main.exe")) {
                $exe = Join-Path $tmp $n
                if (-not (Test-Path $exe)) { throw "$zip : внутри нет $n" }
                $m = PE-Machine $exe
                $one += " $n=$m"
                Write-Host "[ci] $zip / $n = $m (ожидалось $($expect[$a]))"
                if ($m -ne $expect[$a]) { throw "$zip : $n имеет PE machine $m вместо $($expect[$a])" }
              }
              $dlls = @(Get-ChildItem $tmp -Filter *.dll -File)
              foreach ($d in $dlls) {
                $m = PE-Machine $d.FullName
                $one += " $($d.Name)=$m"
                Write-Host "[ci] $zip / $($d.Name) = $m"
                if ($m -ne $expect[$a]) { throw "$zip : $($d.Name) чужой архитектуры ($m вместо $($expect[$a]))" }
              }
              if ($dlls.Count -eq 0) { $one += " dll=none" }
              $facts += $one
              Remove-Item -Recurse -Force $tmp
            }
          } catch {
            Write-Host "::error::zip-verify: $($_.Exception.Message)"
            Write-Host "::error::zip-verify: проверено до сбоя: $($facts -join ' | ')"
            throw "portable zip verification failed"
          }
          Write-Host "::notice::zip-verify: $($facts -join ' | ')"
          Write-Host "[ci] портативные zip: архитектуры совпали"

      - name: Build installers and updaters (iscc)
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $out = ""
          $failed = $false
          try {
            $out = & .\installer\build-installers.ps1 -Version $v -Arch all -Type all -ISCCPath "$env:ISCC" 2>&1 | Out-String
          } catch {
            $failed = $true
            $out += "`nEXCEPTION: " + $_.Exception.Message + "`n" + $_.ScriptStackTrace
          }
          Write-Host $out
          # Успех = все 6 установщиков на месте
          $missing = @()
          foreach ($a in @("x64","x86","arm64")) {
            foreach ($t in @("Setup","Update")) {
              $f = "release\Aeros-Engine-$t-$a-v$v.exe"
              if (-not (Test-Path $f)) { $missing += $f }
            }
          }
          if ($failed -or $missing.Count -gt 0) {
            $lines = ($out -split "`r?`n") | Where-Object { $_.Trim() } | Select-Object -Last 25
            foreach ($line in $lines) { Write-Host "::error::iscc: $line" }
            throw "build-installers.ps1 failed (exit=$LASTEXITCODE, missing: $($missing -join ', '))"
          }
          Write-Host "::notice::iscc: все 6 установщиков собраны, PE-контроль бинарей пройден"
          Write-Host "[ci] all 6 installers present"
          Get-ChildItem release | Format-Table Name, Length

      - name: Verify installers (тихая установка и PE-контроль установленного exe)
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          function PE-Machine($path) {
            $b = [System.IO.File]::ReadAllBytes($path)
            if ($b.Length -lt 64 -or $b[0] -ne 0x4D -or $b[1] -ne 0x5A) { return "????" }
            $pe = [BitConverter]::ToInt32($b, 60)
            return [BitConverter]::ToUInt16($b, $pe + 4).ToString('X4')
          }
          $expect = @{ "x64" = "8664"; "x86" = "014C"; "arm64" = "AA64" }
          $facts = @()
          try {
            # 1. Каждый установщик реально ставим и смотрим, ЧТО легло на диск.
            #    Именно отсутствие такой проверки пропустило баг с Check: FileExists(...)
            #    в [Files] — тогда на диск ложился arm64 exe и пользователь получал код 216.
            foreach ($a in @("x64","x86","arm64")) {
              $setupFile = "release\Aeros-Engine-Setup-$a-v$v.exe"
              if (-not (Test-Path $setupFile)) { throw "нет $setupFile" }
              $setup = (Resolve-Path $setupFile).Path
              $dir = Join-Path $env:RUNNER_TEMP "install-test-$a"
              if (Test-Path $dir) { Remove-Item -Recurse -Force $dir }
              New-Item -ItemType Directory -Path $dir | Out-Null
              Write-Host "[ci] тихая установка: $setup -> $dir"
              $p = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /NOICONS /DIR=`"$dir`"" -Wait -PassThru
              Write-Host "[ci] exit code = $($p.ExitCode)"
              if ($p.ExitCode -ne 0) { throw "Setup-$a : установка завершилась с кодом $($p.ExitCode)" }

              $exe = Join-Path $dir "main.exe"
              if (-not (Test-Path $exe)) { throw "Setup-$a : после установки нет main.exe в $dir" }
              $m = PE-Machine $exe
              $one = "$a installed=$m"
              Write-Host "[ci] установленный main.exe ($a): PE machine = $m (ожидалось $($expect[$a]))"
              if ($m -ne $expect[$a]) {
                throw "Setup-$a : установил main.exe с PE machine $m вместо $($expect[$a]) - пользователь получил бы CreateProcess код 216"
              }
              $dlls = @(Get-ChildItem $dir -Filter *.dll -File)
              foreach ($d in $dlls) {
                $dm = PE-Machine $d.FullName
                $one += " $($d.Name)=$dm"
                Write-Host "[ci] установленный $($d.Name): PE machine = $dm"
                if ($dm -ne $expect[$a]) { throw "Setup-$a : $($d.Name) чужой архитектуры ($dm вместо $($expect[$a]))" }
              }
              if ($dlls.Count -eq 0) { $one += " dll=none" }
              if (Test-Path (Join-Path $dir "ARCH-MISMATCH.txt")) {
                throw "Setup-$a : собственный контроль установщика сообщил о несовпадении архитектуры"
              }
              $one += " mismatch=0"

              $unins = Join-Path $dir "unins000.exe"
              if (Test-Path $unins) {
                $u = Start-Process -FilePath $unins -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART" -Wait -PassThru
                $one += " uninstall=$($u.ExitCode)"
                Write-Host "[ci] деинсталляция exit = $($u.ExitCode)"
              }
              Remove-Item -Recurse -Force $dir -ErrorAction SilentlyContinue
              $facts += $one
            }

            # 2. Апдейтер обязан обновить НАЙДЕННУЮ папку установки, а не папку по умолчанию
            $dir = Join-Path $env:RUNNER_TEMP "update-test"
            if (Test-Path $dir) { Remove-Item -Recurse -Force $dir }
            $setup = (Resolve-Path "release\Aeros-Engine-Setup-x64-v$v.exe").Path
            $p = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /NOICONS /DIR=`"$dir`"" -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "Setup-x64 (подготовка теста апдейтера) завершился с кодом $($p.ExitCode)" }
            $upd = (Resolve-Path "release\Aeros-Engine-Update-x64-v$v.exe").Path
            $q = Start-Process -FilePath $upd -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-" -Wait -PassThru
            Write-Host "[ci] Update-x64 exit = $($q.ExitCode)"
            if ($q.ExitCode -ne 0) { throw "Update-x64 завершился с кодом $($q.ExitCode)" }
            if (-not (Test-Path (Join-Path $dir "update-info.txt"))) {
              throw "Update-x64 не обновил найденную папку $dir - апдейтер ушёл в другую директорию"
            }
            $m = PE-Machine (Join-Path $dir "main.exe")
            Write-Host "[ci] main.exe после апдейта: PE machine = $m"
            if ($m -ne "8664") { throw "Update-x64 положил main.exe с PE machine $m вместо 8664" }
            $defaultDir = Join-Path $env:LOCALAPPDATA "Programs\Aeros Engine"
            if (Test-Path $defaultDir) { throw "Update-x64 создал копию в папке по умолчанию: $defaultDir" }
            $facts += "update-x64 in-place=$m default-dir=none"
            $unins = Join-Path $dir "unins000.exe"
            if (Test-Path $unins) {
              Start-Process -FilePath $unins -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART" -Wait -PassThru | Out-Null
            }
            Remove-Item -Recurse -Force $dir -ErrorAction SilentlyContinue
          } catch {
            Write-Host "::error::install-verify: $($_.Exception.Message)"
            Write-Host "::error::install-verify: проверено до сбоя: $($facts -join ' | ')"
            throw "installer verification failed"
          }
          Write-Host "::notice::install-verify: $($facts -join ' | ')"
          Write-Host "[ci] установщики кладут на диск exe своей архитектуры"

      - name: Checksums and release README
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          Push-Location release
          if (Test-Path SHA256SUMS.txt) { Remove-Item SHA256SUMS.txt -Force }
          Get-ChildItem -File | Where-Object { $_.Name -ne "SHA256SUMS.txt" } | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash)  $($_.Name)" | Out-File -Append SHA256SUMS.txt -Encoding ascii
          }
          @"
          AeroS Engine v$v — PC-релиз (Windows)

          Установщики (рекомендуется):
