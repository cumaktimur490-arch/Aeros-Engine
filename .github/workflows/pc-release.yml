          Get-Content SHA256SUMS.txt
          Pop-Location

      - name: Write release notes
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          @"
          # AeroS Engine v$v — PC-релиз (Windows x64 / x86 / arm64)

          Движок визуализации обтекания 3D-моделей (C++17 / OpenGL 3.3 / CUDA / Dear ImGui).

          ## 📦 Скачать
          **Установщики (рекомендуется):**
          - ``Aeros-Engine-Setup-x64-v$v.exe`` — 64-bit Windows 10/11 (Intel/AMD)
          - ``Aeros-Engine-Setup-x86-v$v.exe`` — 32-bit Windows 10/11
          - ``Aeros-Engine-Setup-arm64-v$v.exe`` — ARM64 Windows 10/11 (Snapdragon, Surface Pro X)

          **Портативные версии (без установки):**
          - ``Aeros-Engine-Portable-x64-v$v.zip`` / ``-x86`` / ``-arm64``

          **Обновления (для уже установленной программы):**
          - ``Aeros-Engine-Update-x64-v$v.exe`` / ``-x86`` / ``-arm64`` — обновляют файлы в папке установки.

          ``SHA256SUMS.txt`` — контрольные суммы всех артефактов.

          ## Установка и запуск
          1. Скачайте установщик под вашу архитектуру (x64 — для большинства ПК) и запустите.
          2. После установки — ярлыки в меню «Пуск» и на рабочем столе (опционально).
          3. При старте выберите STL-модель; примеры — в папке ``models``.

          Управление: WASD — полёт камеры, Space/Shift — вверх/вниз, Ctrl — ускорение, средняя кнопка мыши — вращение, колесо — зум, Esc — выход.

          ## Что нового в v$v
          - **Исправлена ошибка запуска «CreateProcess сбой; код 216» / «Это приложение не удалось запустить на вашем ПК».** Установщики выбирали бинарь во время установки и в итоге клали на диск exe чужой архитектуры (arm64 вместо x64). Теперь каждый установщик, апдейтер и портативный zip несёт бинарь строго своей архитектуры, а в CI каждый пакет реально устанавливается и проверяется PE-заголовок установленного ``main.exe``.
          - Установщик сам контролирует архитектуру установленного файла: при несовпадении выводится понятное сообщение и создаётся ``ARCH-MISMATCH.txt``, автозапуск отключается.
          - Апдейтер теперь обновляет именно ту папку, где программа уже стоит (путь берётся из реестра), а не папку по умолчанию.
          - Из установщиков убраны DLL чужих архитектур и неиспользуемые NVIDIA Streamline ``sl.*.dll``; setup.exe получил иконку.
          - Автоопределение CUDA: на ПК без NVIDIA GPU движок сам переключается на CPU-бэкенд; в панели Compute — имя GPU или сообщение о фолбэке.
          - Полный набор PC-артефактов, как в прежних PC-версиях: Setup / Update / Portable для x64, x86 и arm64.
          - Установщики на русском и английском, ярлыки, деинсталлятор; exe с иконкой и сведениями о версии.
          - Релизная сборка x64: оптимизации (/O2), GPU-архитектуры sm_75/sm_86/sm_89/sm_120 + PTX, CUDA runtime статически — CUDA-дистрибутив для запуска не нужен.

          ## Требования
          - Windows 10/11, OpenGL 3.3; Visual C++ Redistributable 2022 (обычно уже стоит).
          - CUDA-бэкенд — NVIDIA GPU (Turing и новее); иначе автоматически CPU-бэкенд.

          ## Сборка из исходников
          VS 2022 + CUDA Toolkit: ``aeros\build-release.bat`` (x64+CUDA), ``aeros\build-cpu.bat [x64|x86|arm64]`` (CPU);
          установщики: ``installer\build-installers.ps1``, портативные: ``installer\build-portable.ps1`` (Inno Setup 6).
          "@ | Set-Content -Encoding utf8 RELEASE_NOTES.md

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          # Порядок загрузки = порядок в списке ассетов: x64 первыми (самые частые),
          # чтобы arm64/x86 не скачивали по ошибке
          $order = @("Setup-x64","Update-x64","Portable-x64","Setup-x86","Update-x86","Portable-x86","Setup-arm64","Update-arm64","Portable-arm64","SHA256SUMS.txt","README.md")
          $files = @()
          foreach ($pat in $order) {
            $f = Get-ChildItem release -File | Where-Object { $_.Name -like "*$pat*" } | Select-Object -First 1
            if ($f) { $files += $f.FullName }
          }
          Write-Host "Assets (по порядку):"; $files | ForEach-Object { Write-Host "  $_" }
          $title = "AeroS Engine v$v — PC-релиз (Windows x64/x86/arm64: установщики, апдейтеры, портативные)"
          $exists = gh release view "v$v" --json tagName --jq .tagName 2>$null
          if ($LASTEXITCODE -eq 0 -and $exists) {
            # пересоздаём, чтобы порядок ассетов обновился (clobber порядок не меняет)
            Write-Host "Release v$v существует — пересоздаём с новым порядком ассетов"
            gh release delete "v$v" --yes
            gh release create "v$v" $files --title $title --notes-file RELEASE_NOTES.md
          } else {
            gh release create "v$v" $files --title $title --notes-file RELEASE_NOTES.md
          }
